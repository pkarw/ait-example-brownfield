version = 2

prepare = [["bash", "/workspace/scripts/prepare.sh"]]

[[processes]]
name = "mariadb"
command = ["/usr/sbin/mariadbd", "--datadir=/workspace/.runtime/mysql", "--socket=/workspace/.runtime/mysql.sock", "--pid-file=/workspace/.runtime/mysql.pid", "--skip-networking", "--log-error=/workspace/.runtime/mysql.log"]

[preview]
command = ["php", "-S", "0.0.0.0:3000", "-t", "/workspace/wordpress", "/workspace/scripts/router.php"]
